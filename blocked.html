<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>SiteLock</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; width: 320px; }
    h1 { margin-top: 0; font-size: 1.2rem; }
    input { width: 100%; padding: 0.6rem; margin: 0.5rem 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 0.6rem; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #006cbd; }
    #msg { color: #d32f2f; margin-top: 0.5rem; min-height: 1.2rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>网站已被锁定</h1>
    <p>请输入密码后继续访问</p>
    <input type="password" id="pwd" placeholder="密码" autofocus>
    <button id="unlock">解锁</button>
    <div id="msg"></div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
