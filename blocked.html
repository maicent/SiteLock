<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title id="pageTitle">SiteLock</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f5f5f5; }
    .box { display: flex; justify-content: center; align-items: center; height: 100vh; }
    .box .inner { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; width: 320px; }
    .network { background: #fff; color: #5f6368; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
    .network .inner { text-align: center; max-width: 500px; padding: 2rem; }
    .network h1 { font-size: 1.5rem; color: #202124; font-weight: normal; }
    .network .err { color: #5f6368; margin: 1rem 0; }
    .network #reload { background: #1a73e8; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
    .network #reload:hover { background: #1662c4; }
    .network .unlock-form { margin-top: 2rem; }
    .maintenance { background: #f5f5f5; color: #333; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
    .maintenance .inner { max-width: 400px; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .maintenance h1 { font-size: 1.5rem; color: #555; }
    input { width: 100%; padding: 0.6rem; margin: 0.5rem 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button.unlock { width: 100%; padding: 0.6rem; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button.unlock:hover { background: #006cbd; }
    #msg { color: #d32f2f; margin-top: 0.5rem; min-height: 1.2rem; }
  </style>
</head>
<body>
  <div id="page" class="box"></div>
  <script src="blocked.js"></script>
</body>
</html>
